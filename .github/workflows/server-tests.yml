name: Server

on:
  pull_request:
    branches:
      - main
      - main-hotfix
      - develop

    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'

concurrency:
  group: develop-helpdesk-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
        mysql:
          image: mariadb:10.6
          env:
            MARIADB_ROOT_PASSWORD: 'root'
          ports:
            - 3306:3306
          options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check for valid Python & Merge Conflicts
        if: github.event.pull_request.base.ref == 'develop'
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
            then echo "Found merge conflicts"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: 24
          check-latest: true

      - name: Install Yarn
        run: npm install -g yarn

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helpers/install.sh
        env:
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.inputs.branch }}

      - name: Run Tests
        run: 'cd ~/frappe-bench/ && bench --site test_site run-tests --app helpdesk --coverage'
        env:
          TYPE: server
          CI_BUILD_ID: ${{ github.run_id }}
      
      # >>> nonagenticai fork divergence from frappe/helpdesk (2026-09-23) >>>
      # This estate does not use GitHub Actions artifact storage (the org quota
      # is exhausted; an upload step runs LAST, so it fails after the work is
      # paid for and takes the only copy with it).
      #
      # Upstream uploads coverage.xml as an artifact and a separate "Coverage
      # Wrap Up" job downloads it and forwards it to Codecov. That fan-in shape
      # is inherited from frappe/frappe, which shards tests across a container
      # matrix. This workflow has NO matrix (neither here nor upstream), so
      # `matrix.container` resolved to the empty string and the wrap-up job was
      # fanning in exactly one file. We send that one file to Codecov from this
      # job directly and drop the wrap-up job.
      #
      # Same action, same major version, same name/token/fail_ci_if_error/
      # verbose inputs as upstream. `files` + `disable_search` replace the
      # implicit workspace search that the wrap-up job relied on, because
      # coverage.xml lives outside GITHUB_WORKSPACE in this job.
      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          name: MariaDB
          files: /home/runner/frappe-bench/sites/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
      # <<< end nonagenticai fork divergence <<<
